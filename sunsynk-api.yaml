        sellTime2Volt:
          type: string
        sellTime3Volt:
          type: string
        sellTime4Volt:
          type: string
        sellTime5Volt:
          type: string
        sellTime6Volt:
          type: string
        sellTime1En:
          type: string
          description: "Slot 1 enable (0/1)"
        sellTime2En:
          type: string
        sellTime3En:
          type: string
        sellTime4En:
