        genPower:
          type: integer
          description: Generator power (W)
        minPower:
          type: integer
          description: Micro inverter power (W)
        soc:
          type: number
          description: Battery state of charge (%)
        smartLoadPower:
          type: integer
        upsLoadPower:
          type: integer
        homeLoadPower:
          type: integer
        chargePilePower:
          type: integer
        pvTo:
          type: boolean
          description: PV producing
        toLoad:
          type: boolean
        toSmartLoad:
          type: boolean
        toUpsLoad:
          type: boolean
        toHomeLoad:
          type: boolean
        toGrid:
          type: boolean
          description: Exporting to grid
        toBat:
          type: boolean
          description: Charging battery
        batTo:
          type: boolean
          description: Battery discharging
        gridTo:
          type: boolean
          description: Importing from grid
        genTo:
          type: boolean
        minTo:
          type: boolean
        toChargePile:
          type: boolean
        existsGen:
          type: boolean
        existsMin:
          type: boolean
        existsGrid:
          type: boolean
        genOn:
          type: boolean
        microOn:
          type: boolean
        existsMeter:
          type: boolean
        bmsCommFaultFlag:
          type: boolean
          nullable: true
        existsThreeLoad:
          type: boolean
        existsSmartLoad:
          type: boolean
        existsChargePile:
          type: boolean
        pv:
