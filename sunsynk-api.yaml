        dischargeVolt:
          type: number
        chargeCurrentLimit:
          type: number
        dischargeCurrentLimit:
          type: number
        maxChargeCurrentLimit:
          type: number
        maxDischargeCurrentLimit:
          type: number
        status:
          type: integer
          description: "2 = discharging"
        numberOfBatteries:
