          nullable: true

    LoadRealtime:
      type: object
      properties:
        totalUsed:
          type: number
          description: Total energy consumed (kWh)
        dailyUsed:
          type: number
          description: Today's consumption (kWh)
        vip:
          type: array
          items:
            $ref: '#/components/schemas/VoltCurrentPower'
        totalPower:
          type: integer
          description: Current load power (W)
        smartLoadStatus:
          type: integer
        loadFac:
          type: number
        upsPowerL1:
          type: number
        upsPowerL2:
          type: number
        upsPowerL3:
          type: number
        upsPowerTotal:
          type: number

    EpsRealtime:
      type: object
      properties:
        vr:
          type: number
        ir:
          type: number
        qr:
          type: integer
        pr:
          type: integer
        vs:
          type: number
        is:
          type: number
        qs:
          type: integer
        ps:
          type: integer
        vt:
          type: number
        it:
          type: number
        qt:
          type: integer
        pt:
          type: integer
        pac:
          type: integer
        etoday:
          type: number
        etotal:
          type: number

    GenRealtime:
      type: object
