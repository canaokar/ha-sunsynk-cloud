  # ============ SETTINGS WRITE - COMMON (HYBRID) ============
  /api/v1/common/setting/{sn}/set:
    post:
      tags: [Settings Write]
      summary: Write inverter settings (Hybrid/Deye)
      description: |
        Send only the fields you want to change. All values as strings.

        **CRITICAL SAFETY NOTES:**
        - Do NOT mix battery settings with system mode settings in a single request
        - Changes propagate through cloud to inverter - may take 60+ seconds
        - Use exponential backoff (3 attempts, 4-10s delays) for reliability
        - Verify changes by re-reading settings after write

        **Common use cases:**
        - Change work mode: `{"sysWorkMode": "2", "peakAndVallery": "1"}`
        - Set timer slot: `{"sellTime1": "06:00", "sellTime1Pac": "3000", "cap1": "100", "time1on": "true"}`
        - Enable solar sell: `{"solarSell": "1", "solarMaxSellPower": "10000"}`
        - Set battery limits: `{"batteryShutdownCap": "15", "batteryRestartCap": "20"}`
      parameters:
        - name: sn
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonSettings'
            examples:
              changeWorkMode:
                summary: Change to Limited to Home mode
                value:
                  sysWorkMode: "2"
                  peakAndVallery: "1"
              setTimerSlot:
                summary: Configure timer slot 1
                value:
                  sellTime1: "06:00"
                  sellTime1Pac: "3000"
                  cap1: "100"
                  time1on: "true"
                  sellTime1En: "1"
              enableGridCharge:
                summary: Enable grid charging
                value:
                  sdChargeOn: "1"
                  sdStartCap: "30"
                  sdBatteryCurrent: "110"
              setBatteryLimits:
                summary: Set battery SOC limits
                value:
                  batteryShutdownCap: "15"
                  batteryRestartCap: "20"
                  batteryLowCap: "25"
      responses:
        '200':
          description: Settings applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

