security:
  - BearerAuth: []

paths:
  # ============ AUTHENTICATION ============
  /anonymous/publicKey:
    get:
      tags: [Authentication]
      summary: Get RSA public key for password encryption
      security: []
      parameters:
        - name: nonce
          in: query
          required: true
          schema:
            type: string
          description: Millisecond timestamp
        - name: source
          in: query
          required: true
          schema:
            type: string
            enum: [sunsynk, elinter]
        - name: sign
          in: query
          required: true
          schema:
            type: string
          description: "MD5 of 'nonce={nonce}&source={source}POWER_VIEW'"
      responses:
        '200':
          description: RSA public key (Base64 DER format)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: string
                        description: Base64-encoded DER public key

  /oauth/token/new:
    post:
      tags: [Authentication]
      summary: Authenticate with RSA-encrypted password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sign, nonce, username, password, grant_type, client_id, source]
              properties:
                sign:
                  type: string
                  description: "MD5 of 'nonce={nonce}&source={source}{pubkey_first_10_chars}'"
                nonce:
                  type: string
                  description: Millisecond timestamp
                username:
                  type: string
                  format: email
                password:
                  type: string
                  description: RSA PKCS1v15-encrypted Base64 password
                grant_type:
                  type: string
                  enum: [password]
                client_id:
                  type: string
                  enum: [csp-web]
                source:
                  type: string
                  enum: [sunsynk, elinter]
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'

  /oauth/check/token/code:
    post:
      tags: [Authentication]
      summary: Verify MFA token code
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Token check result

  /anonymous/checkAccount:
    get:
      tags: [Authentication]
      summary: Check if account exists
      security: []
      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account check result

  /anonymous/account/MfaStatus:
