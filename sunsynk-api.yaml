        etodayFrom:
          type: string
          description: Today's grid import (kWh)
        etodayTo:
          type: string
          description: Today's grid export (kWh)
        etotalFrom:
          type: string
          description: Total grid import (kWh)
        etotalTo:
          type: string
          description: Total grid export (kWh)
        limiterPowerArr:
          type: array
          items:
            type: integer
        limiterTotalPower:
          type: integer

    BatteryRealtime:
      type: object
      properties:
        etodayChg:
          type: string
          description: Today's charge energy (kWh)
        etodayDischg:
          type: string
          description: Today's discharge energy (kWh)
        emonthChg:
          type: string
        emonthDischg:
          type: string
        eyearChg:
          type: string
        eyearDischg:
          type: string
        etotalChg:
          type: string
        etotalDischg:
          type: string
        type:
