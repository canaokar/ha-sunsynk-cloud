openapi: 3.0.3
info:
  title: Sunsynk Cloud API
  description: |
    Reverse-engineered API specification for the Sunsynk/Deye cloud platform (https://www.sunsynk.net).
    Extracted from the web application JavaScript bundles and validated against live API responses.

    **Base URL:** `https://api.sunsynk.net`

    **Authentication:** RSA-encrypted password flow via `/oauth/token/new`. All authenticated
    endpoints require `Authorization: Bearer <access_token>` header.

    **Rate Limiting:** Community convention is minimum 60-second polling interval.

    **Settings Write Safety:** Battery settings and system mode settings must be sent in separate
    POST requests. Never mix them in a single call.

    **Inverter Types & Setting Endpoints:**
    - Type 2 (Hybrid/Deye): Uses `common/setting/{sn}/read` and `common/setting/{sn}/set`
    - Grid-Tied (GY): Uses `gy/setting/{sn}/read` and individual POST endpoints
    - Micro/String (MT): Uses `mt/setting/{sn}/read` and individual POST endpoints
    - SiDaoEr brand: Uses `setting/sidaoer/{sn}/read` and individual POST endpoints
    - UNEET brand: Uses `setting/uneet/{sn}/read` and individual POST endpoints
    - Sunsynk Store Single Phase: Uses `sunsynk/store/singlePhase/{sn}/read` and setting/* endpoints
    - Sunsynk Store Three Phase: Uses `sunsynk/store/threePhase/{sn}/read` and setting/* endpoints
  version: 1.0.0
  contact:
    name: Extracted from sunsynk.net web app
  license:
    name: For personal use only

servers:
  - url: https://api.sunsynk.net
    description: Sunsynk Cloud API (primary)
  - url: https://api.solarkcloud.com
    description: SolArk Cloud API (same backend, SolArk-branded inverters)

tags:
  - name: Authentication
    description: Login, token refresh, account management
  - name: User
    description: User profile and preferences
  - name: Plants
    description: Plant/station management and overview
  - name: Inverters
    description: Inverter listing and details
  - name: Realtime Data
    description: Live power flow, PV, grid, battery, load data
  - name: Historical Data
    description: Day/month/year/total energy charts
  - name: Settings Read
    description: Read inverter configuration (safe, GET only)
  - name: Settings Write
    description: Write inverter configuration (CAUTION - changes live system)
  - name: Settings Write - GY (Grid-Tied)
    description: Settings for grid-tied inverters
  - name: Settings Write - MT (Micro/String)
    description: Settings for micro/string inverters
  - name: Settings Write - Sunsynk Store Single Phase
    description: Settings for Sunsynk Store single-phase inverters
  - name: Settings Write - Sunsynk Store Three Phase
    description: Settings for Sunsynk Store three-phase inverters
  - name: Settings Write - SiDaoEr
    description: Settings for SiDaoEr brand inverters
  - name: Events
    description: Alarms, faults, and event history
  - name: Gateway
    description: Data logger/gateway management
  - name: Battery
    description: Battery pack information and events
  - name: Meter
    description: Energy meter data
  - name: AC Switch
    description: AC smart switch control
  - name: Charge Pile
    description: EV charge pile management
  - name: Smart Rules
    description: Automation rules and smart scheduling
  - name: Firmware
    description: Firmware management and upgrades
  - name: Dictionary
    description: Reference data (timezones, currencies, etc.)
  - name: Weather
    description: Weather and meteorological data

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Obtained via /oauth/token/new RSA-encrypted login flow

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          description: "0 = success, 2 = no permissions, 400 = bad request, 500 = server error"
        msg:
          type: string
        data:
          type: object
        success:
          type: boolean

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT bearer token
        refresh_token:
          type: string
        scope:
          type: string
          example: "all"
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Token TTL in seconds (typically 604799 = ~7 days)
          example: 604799

    UserInfo:
      type: object
      properties:
        id:
          type: integer
          example: 454113
        nickname:
          type: string
        avatar:
          type: string
          format: uri
        gender:
          type: integer
        mobile:
          type: string
          nullable: true
        createAt:
          type: string
          format: date-time
        type:
          type: string
          nullable: true
        tempUnit:
          type: string
          example: "℃"
        company:
          type: object
          nullable: true
        userSrc:
          type: string
          example: "sunsynk"

    UserPersonalized:
      type: object
      properties:
        tempUnit:
          type: integer
        lanWeb:
          type: string
          example: "en"
        alertEmail:
          type: string
          format: email
        emailEnable:
          type: integer

    PlantInfo:
      type: object
      properties:
        id:
          type: integer
          example: 537602
        name:
          type: string
        thumbUrl:
          type: string
          format: uri
        status:
          type: integer
          description: "1 = online"
        address:
          type: string
        pac:
          type: integer
          description: Current power (W)
        efficiency:
          type: number
        etoday:
          type: number
          description: Today's energy (kWh)
        etotal:
          type: number
          description: Total energy (kWh)
        updateAt:
          type: string
          format: date-time
        createAt:
          type: string
          format: date-time
        type:
          type: integer
          description: "2 = hybrid"
        masterId:
          type: integer
        share:
          type: boolean
        plantPermission:
          type: array
          items:
            type: string
          description: List of permission strings the current user has
        existCamera:
          type: boolean
        email:
          type: string
        phone:
          type: string
          nullable: true
        productWarrantyRegistered:
          type: integer

    PlantRealtime:
      type: object
      properties:
        pac:
          type: integer
          description: Current PV power (W)
        efficiency:
          type: number
        etoday:
          type: number
          description: Today's energy (kWh)
        emonth:
          type: number
        eyear:
          type: number
        etotal:
          type: number
        totalPower:
          type: number
          description: Total installed capacity (kW)
        currency:
          type: object
          properties:
            id:
              type: integer
            code:
              type: string
              example: "GBP"
            text:
              type: string
              example: "£"
        invest:
          type: number
        income:
          type: number
        updateAt:
          type: string
          format: date-time

    InverterInfo:
      type: object
      properties:
        id:
          type: integer
        sn:
          type: string
          description: Inverter serial number (primary identifier)
          example: "2601120338"
        alias:
          type: string
        gsn:
          type: string
          description: Gateway serial number
        status:
          type: integer
          description: "1 = online"
        type:
          type: integer
          description: "2 = hybrid"
        commTypeName:
          type: string
          example: "RS485"
        custCode:
          type: integer
        version:
          $ref: '#/components/schemas/InverterVersion'
        model:
          type: string
        equipMode:
          type: string
          nullable: true
        pac:
          type: integer
          description: Current power (W)
        etoday:
          type: number
        etotal:
          type: number
        updateAt:
          type: string
          format: date-time
        opened:
          type: integer
        plant:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            type:
              type: integer
        sunsynkEquip:
          type: boolean
        protocolIdentifier:
          type: string
        equipType:
          type: integer
        ratePower:
          type: integer
          description: Rated power in watts
        brand:
          type: string
          example: "Deye"
        pvNum:
          type: integer
          description: Number of PV string inputs

    InverterVersion:
      type: object
      properties:
