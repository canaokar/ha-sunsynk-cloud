      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MFA status

  /anonymous/getCode:
    get:
      tags: [Authentication]
      summary: Request verification code (email)
      security: []
      responses:
        '200':
          description: Code sent

  /anonymous/getVerificationCode:
    get:
      tags: [Authentication]
      summary: Request verification code (alternative)
      security: []
      responses:
        '200':
          description: Code sent

  /anonymous/checkCode:
    get:
      tags: [Authentication]
      summary: Validate verification code
      security: []
      responses:
        '200':
          description: Code validation result

  /anonymous/resetPwd:
    post:
      tags: [Authentication]
      summary: Reset password
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Password reset result

  /anonymous/signup:
    post:
      tags: [Authentication]
      summary: Register new account
      security: []
      requestBody:
        content:
          application/json:
