                description: "W for day power charts, kWh for energy charts, kW for EMS"
              records:
                type: array
                items:
                  type: object
                  properties:
                    time:
                      type: string
                      description: "HH:MM for day, YYYY-MM-DD for month, MM for year, YYYY for total"
                    value:
                      type: string
                    updateTime:
                      type: string
                      nullable: true
              label:
                type: string
                description: "e.g. 'PV Generation', 'Load Power Consumption'"
              name:
                type: string
              sn:
                type: string
                nullable: true

    GenerationUse:
      type: object
